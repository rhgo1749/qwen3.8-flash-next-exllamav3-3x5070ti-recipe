model:
  backend: exllamav3
  max_seq_len: 262144
  cache_size: 524288
  cache_mode: "8,4"

  tensor_parallel: false
  gpu_split_auto: false

  # Validated on 3x RTX 5070 Ti 16 GB.
  # GPU0 headroom is deliberate; it also helps on display-attached or desktop-used GPUs.
  gpu_split: [11.0, 15.0, 15.0]

  # 512 routed experts/layer, 280 GPU-resident + 232 CPU-resident.
  cpu_moe_split_experts: 232
  cpu_moe_threads: 24

  ngram_ram: true
  chunk_size: 2048
  output_chunking: true
  max_batch_size: 3

  vision: true
  vision_offload: false

  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  start_in_reasoning: always

  tool_calls_in_reasoning: true
  tool_format: qwen3_coder

draft_model:
  draft_mode: mtp
  draft_cache_mode: "8,4"

  # Place the MTP component in GPU0's reserved headroom.
  draft_gpu_split: [3, 0, 0]

  # Best tested production point.
  draft_num_tokens: 3
  dynamic_draft: false
