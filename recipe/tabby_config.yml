model:
  backend: exllamav3
  max_seq_len: 262144
  cache_size: 524288
  cache_mode: "8,4"

  tensor_parallel: false
  gpu_split_auto: false

  # Performance mode, validated on 3x RTX 5070 Ti 16 GB.
  # The third GPU is the tightest device at roughly 15.2 GiB observed usage.
  gpu_split: [15.0, 15.0, 14.0]

  # 512 routed experts/layer, 304 GPU-resident + 208 CPU-resident.
  cpu_moe_split_experts: 208
  cpu_moe_threads: 24

  # Stream the ~31 GB PLE table from NVMe/page cache instead of pinning it in RAM.
  ngram_ram: false
  chunk_size: 2048
  output_chunking: true
  max_batch_size: 3

  vision: true
  vision_offload: false

  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  start_in_reasoning: always

  tool_calls_in_reasoning: true
  tool_format: qwen3_coder

draft_model:
  draft_mode: mtp
  draft_cache_mode: "8,4"

  # Place the MTP component on GPU2; this allowed the CPU expert split to reach 208.
  draft_gpu_split: [0, 0, 3]

  # MTP3 remains the ceiling; dynamic drafting trims low-value draft positions.
  draft_num_tokens: 3
  dynamic_draft: true
  draft_confidence: 0.4
  record_draft_stats: false
